[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# Só para AVALIAÇÃO: roda o investigador pelo Claude Code local, na
# assinatura do desenvolvedor. Não é runtime de produto — ver o docstring
# de orchestrator/eval/assinatura.py.
assinatura = ["claude-agent-sdk>=0.2"]

[project.scripts]
orchestrator = "orchestrator.cli:main"
orchestrator-eval = "orchestrator.eval.agent_eval:main"
orchestrator-grill = "orchestrator.grill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
