[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13"]
# Só para EXPORTAR o trace. O modelo interno é `kernel/trace.py` e não OTel —
# ver ADR-08 e o docstring de `observability/otel.py`: custo em micro-centavos
# int não tem lugar canônico em OTel, e `abstencao`/`pulado` não são OK nem
# ERROR. O kernel continua com UMA dependência de runtime.
otel = ["opentelemetry-api>=1.20"]
# Só para AVALIAÇÃO: roda o investigador pelo Claude Code local, na
# assinatura do desenvolvedor. Não é runtime de produto — ver o docstring
# de orchestrator/eval/assinatura.py. O adaptador de assinatura da
# entrevista (orchestrator/grill/assinatura.py) NÃO depende deste extra: a
# implementação escolhida lá é um alias do cliente de chave de API, sem
# nenhum import do SDK — ver o docstring de lá para a sonda que levou a
# essa escolha.
assinatura = ["claude-agent-sdk>=0.2"]

[project.scripts]
orchestrator = "orchestrator.cli:main"
orchestrator-eval = "orchestrator.eval.agent_eval:main"
orchestrator-grill = "orchestrator.grill.cli:main"
orchestrator-trace = "orchestrator.observability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
